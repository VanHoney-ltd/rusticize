[package]
name = "rusticize"
version = "0.2.0"
edition = "2021"
authors = ["VanHoney-ltd <stygionevidencesystems@gmail.com>"]
description = "Rust learning platform with built-in playground — NEMESIS ENGINE"
license = "MIT"
repository = "https://github.com/VanHoney-ltd/rusticize"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
anyhow = "1"
thiserror = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
regex = "1"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
